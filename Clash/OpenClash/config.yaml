    url: https://github.com/LM-Firefly/Rules/raw/master/PROXY/Telegram.list
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: https://github.com/Loyalsoldier/clash-rules/raw/release/direct.txt
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: https://github.com/Loyalsoldier/clash-rules/raw/release/cncidr.txt
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: https://github.com/Loyalsoldier/clash-rules/raw/release/lancidr.txt
    interval: 86400
rules:
- RULE-SET,AppleCN,DIRECT,no-resolve,no-resolve
- RULE-SET,AppleProxy,Apple Agent Services,no-resolve
- RULE-SET,Google,Google Services,no-resolve
- RULE-SET,Bilibili,Bilibili,no-resolve
- RULE-SET,TikTok,TikTok,no-resolve
- RULE-SET,Microsoft,DIRECT,no-resolve
- DOMAIN,domain name,EmbyProxy,no-resolve
- RULE-SET,Emby,Emby,no-resolve
- RULE-SET,Live broadcast,Live broadcast,no-resolve
- RULE-SET,Github,Github,no-resolve
- RULE-SET,OpenAI,OpenAI,no-resolve
- RULE-SET,SteamCN,DIRECT,no-resolve
- RULE-SET,Steam,Steam,no-resolve
- RULE-SET,Discord,Discord,no-resolve
- RULE-SET,Telegram,Telegram,no-resolve
- RULE-SET,direct,DIRECT,no-resolve
- GEOSITE,geolocation-!cn,Main Node
- RULE-SET,cncidr,DIRECT,no-resolve
- RULE-SET,lancidr,DIRECT,no-resolve
- MATCH,Main Node
