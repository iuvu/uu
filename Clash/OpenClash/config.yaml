dns:
  enable: true
  respect-rules: true
  ipv6: true
  enhanced-mode: redir-host
  direct-nameserver-follow-policy: true
  default-nameserver:
  - 
  nameserver:
  - 
  proxy-server-nameserver:
  - 
  nameserver-policy:
    geosite:cn,private:
    - 
    geosite:geolocation-!cn:
    - 
  direct-nameserver:
  - 

hosts:
# App Store 下载请求解析 金山CDN
'iosapps.itunes.apple.com':  iosapps.itunes.apple.com.download.ks-cdn.com

proxies:
- type: ss

proxy-groups:
- name: Main Node
  include-all: true
  type: select
  proxies:
  - DIRECT
- name: Apple Agent Services
  include-all: true
  type: select
  proxies:
  - Main Node
- name: Google Services
  include-all: true
  type: select
  proxies:
  - Main Node
- name: Bilibili
  include-all: true
  type: select
  proxies:
  - DIRECT
  - Main Node
- name: TikTok
  include-all: true
  type: select
  proxies:
  - Main Node
- name: EmbyProxy
  include-all: true
  type: select
  proxies:
  - Main Node
  - DIRECT
- name: Emby
  include-all: true
  type: select
  proxies:
  - Main Node
  - DIRECT
- name: Live broadcast
  include-all: true
  type: select
  proxies:
  - Main Node
  - DIRECT
- name: Github
  include-all: true
  type: select
  proxies:
  - Main Node
- name: OpenAI
  include-all: true
  type: select
  proxies:
  - Main Node
- name: Steam
  include-all: true
  type: select
  proxies:
  - Main Node
  - DIRECT
- name: Discord
  include-all: true
  type: select
  proxies:
  - Main Node
- name: Telegram
  include-all: true
  type: select
  proxies:
  - Main Node
rule-providers:
  AppleCN:
    type: http
    behavior: classical
    format: text
    url: https://github.com/Repcz/Tool/raw/X/mihomo/Rules/AppleCN.list
    interval: 86400
  AppleProxy:
    type: http
    behavior: classical
    format: text
    url: https://github.com/Repcz/Tool/raw/X/mihomo/Rules/AppleProxy.list
    interval: 86400
  Google:
    type: http
    behavior: classical
    format: text
    url: https://github.com/Repcz/Tool/raw/X/mihomo/Rules/Google.list
    interval: 86400
  Bilibili:
    type: http
    behavior: classical
    format: text
    url: https://github.com/Repcz/Tool/raw/X/mihomo/Rules/Bilibili.list
    interval: 86400
  Microsoft:
    type: http
    behavior: classical
    format: text
    url: https://github.com/Repcz/Tool/raw/X/mihomo/Rules/Microsoft.list
    interval: 86400
  TikTok:
    type: http
    behavior: classical
    format: text
    url: https://github.com/Repcz/Tool/raw/X/mihomo/Rules/TikTok.list
    interval: 86400
  Emby:
    type: http
    behavior: classical
    format: text
    url: https://github.com/iuvu/uu/raw/u/Rules/list/Emby.list
    interval: 86400
  Live broadcast:
    type: http
    behavior: classical
    format: text
    url: https://github.com/iuvu/uu/raw/u/Rules/list/Live_broadcast.list
    interval: 86400
  Github:
    type: http
    behavior: classical
